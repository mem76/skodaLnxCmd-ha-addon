configuration:
  SKODA_VIN:
    name: Vehicle VIN
    description: >
      The 17-character VIN of your vehicle.

  SKODA_KEY:
    name: API Key
    description: >
      Your Skoda API key, typically starting with "msk_".

  SKODA_PIN:
    name: S-PIN
    description: >
      The 4-digit S-PIN used for remote commands.

  SKODA_STATUS_TTL:
    name: Cache time
    description: >
      Number of seconds to cache status (30-1800 s.)

  SKODA_TARGET_TEMP:
    name: Target Temperature
    description: >
      Target cabin temperature. Controls AC for EVs and heater for ICEVs.
      
  SKODA_ISHOME_CHARGE_PROFILE:
    name: Profile name when parked at home.
    description: >
      IS_HOME is set to true if charging profile name equal this value.

  SKODA_ISHOME_PARKING_ADDRESS:
    name: Parking address includes when pared at home.
    description: >
      IS_HOME is set to true if parking address includes this value.
