################################################################################### 
#  How to install.                                                                #
#                                                                                 #
# 1. create a directory for config file (/config/packages)                        #
# 2. copy this file into the directory (you many change the name).                #
# 3. Add the following two lines into /config/configuration.yaml (if missing)     #
# homeassistant:                                                                  #
#   packages: !include_dir_named packages                                         #
#                                                                                 #
# HA will change to the correct hostname and vehicle name if this file is fetch   #
# via the HA web interface. If you manually copy it from GitLab you may have to   #
# change the hostname manually                                                    #
#                                                                                 #
###################################################################################
# Copy of this file:
# https://raw.githubusercontent.com/mem76/skodaLnxCmd-ha-addon/refs/heads/master/skodalnxcmd/sample.skoda.yaml

# Buttons works better with an asynchronous data source.
template:
  - button:
      - name: "Start Škoda AC"
        unique_id: skoda_car0_ac_start
        press:
          - action: rest_command.skoda_car0_ac_start
  - button:
      - name: "Stop Škoda AC"
        unique_id: skoda_elroq_ac_stop
        press:
          - action: rest_command.skoda_car0_ac_stop
  - button:
      - name: "Start Škoda Charging"
        unique_id: skoda_car0_charge_start
        press:
          - action: rest_command.skoda_car0_charge_start
  - button:
      - name: "Stop Škoda Charging"
        unique_id: skoda_car0_charge_stop
        press:
          - action: rest_command.skoda_car0_charge_stop
  - sensor:
      - name: "Škoda Position"
        unique_id: skoda_car0_position
        state: "parked"
        attributes:
          latitude: "{{ states('sensor.skoda_latitude') }}"
          longitude: "{{ states('sensor.skoda_longitude') }}"
  # - image:  ## More testing needed
  #    - name: "Škoda Image"
  #      unique_id: skoda_car0_vehicle_image
  #      url: "{{ states('sensor.skoda_elroq_meta_vehicle_image_uri') }}"

# Commands          
rest_command:
  skoda_car0_ac_start:
    url: "http://4edeb129-skodalnxcmd-service:8080/ac/on"
    method: POST
  skoda_car0_ac_stop:
    url: "http://4edeb129-skodalnxcmd-service:8080/ac/off"
    method: POST
  skoda_car0_charge_start:
    url: "http://4edeb129-skodalnxcmd-service:8080/charge/on"
    method: POST
  skoda_car0_charge_stop:
    url: "http://4edeb129-skodalnxcmd-service:8080/charge/off"
    method: POST

# Sensors
rest:
  - resource: http://4edeb129-skodalnxcmd-service:8080/status
    # max 20 API calls per hour, with 300 interval 12 req is used for status, leaving 6 req/hour for commands.
    # the "app" will automatically increase cache time if it detects that you are running over budget.
    scan_interval: 300
    binary_sensor:
      - name: "Škoda Charging"
        unique_id: skoda_car0_charging
        icon: mdi:battery-charging
        value_template: "{{ value_json.charging }}"

      - name: "Škoda Charge Cable Connected"
        unique_id: "skoda_car0_charge_cable_connected"
        icon: mdi:ev-plug-type2
        value_template: "{{ value_json.charge_cable_connected }}"

      - name: "Škoda AC"
        unique_id: skoda_car0_ac
        icon: mdi:air-conditioner
        value_template: "{{ value_json.ac }}"

      - name: "Škoda Locked"
        unique_id: skoda_car0_locked
        value_template: "{{ value_json.locked }}"
        icon: mdi:car-door-lock

      - name: "Škoda Is Home"
        unique_id: skoda_car0_is_home
        value_template: "{{ value_json.is_home }}"
    sensor:
      - name: "Škoda State of Charge"
        unique_id: skoda_car0_soc
        value_template: "{{ value_json.soc }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:car-electric

      - name: "Škoda Range"
        unique_id: skoda_car0_range
        value_template: "{{ value_json.range }}"
        device_class: distance
        state_class: measurement
        unit_of_measurement: "km"

      - name: "Škoda Odometer"
        unique_id: skoda_car0_odometer
        value_template: "{{ value_json.odometer }}"
        unit_of_measurement: "km"
        device_class: distance
        state_class: total_increasing
        icon: mdi:counter

      - name: "Škoda Parking Location"
        unique_id: skoda_car0_parking_location
        value_template: "{{ value_json.parking_location }}"
        icon: mdi:map-marker

      - name: "Škoda Charge Completion"
        unique_id: skoda_car0_charge_completion
        value_template: "{{ value_json.charge_done }}"
        device_class: timestamp
        icon: mdi:clock-check-outline

      - name: "Škoda Charging Power"
        unique_id: skoda_car0_charging_power
        value_template: "{{ value_json.charge_power | float(0) }}"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt

      - name: "Škoda Charging Rate"
        unique_id: skoda_car0_charging_rate
        value_template: "{{ value_json.charge_rate | int(0) }}"
        unit_of_measurement: "km/h"
        state_class: measurement
        icon: mdi:speedometer

      - name: "Škoda AC State"
        unique_id: skoda_car0_ac_state
        value_template: "{{ value_json.ac_state }}"
        icon: mdi:air-conditioner

      - name: "Škoda Locked Status"
        unique_id: skoda_car0_locked_status
        value_template: "{{ value_json.locked_status }}"

      - name: "Škoda Latitude"
        unique_id: skoda_car0_latitude
        value_template: "{{ value_json.parking_coordinates.latitude }}"

      - name: "Škoda Longitude"
        unique_id: skoda_car0_longitude
        value_template: "{{ value_json.parking_coordinates.longitude }}"
      
      - name: "Škoda Key expire date"
        unique_id: skoda_car0_meta_api_key_expire_date
        device_class: timestamp
        icon: mdi:clock-end
        value_template: "{{ value_json.meta.key_expires_date }}"

      - name: "Škoda Vehicle Report Time (oldest)"
        unique_id: skoda_car0_meta_vehicle_report_timestamp_min
        device_class: timestamp
        icon: mdi:cloud-upload-outline
        value_template: "{{ value_json.meta.vehicle_report_timestamp_min }}"

      - name: "Škoda Vehicle Report Time (newest)"
        unique_id: skoda_car0_meta_vehicle_report_timestamp_max
        device_class: timestamp
        icon: mdi:cloud-upload-outline
        value_template: "{{ value_json.meta.vehicle_report_timestamp_max }}"

      - name: "Škoda Vehicle Status TTL"
        unique_id: skoda_elroq_meta_vehicle_status_ttl
        device_class: duration
        unit_of_measurement: s
        value_template: "{{ value_json.meta.cache_ttl | int(0) }}"

      - name: "Škoda Vehicle Image URI"
        unique_id: skoda_car0_meta_vehicle_image_uri
        value_template: "{{ value_json.meta.vehicle_image_uri }}"
